<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10241E"><title>Jornada Puri: RPG da Cultura Viva</title>
<style>
:root{--f:#10241E;--m:#365747;--b:#B96F4D;--o:#E8BE69;--c:#F2EFE4}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 15% 0,#24503f,var(--f) 62%) fixed;color:var(--c);font:16px/1.5 system-ui,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
h1,h2,h3{font-family:Georgia,'Palatino Linotype',serif;line-height:1.2}h2{color:var(--o);margin:18px 0 4px}h1{font-size:1.7rem}
.row{display:flex;gap:10px;align-items:center;margin-bottom:6px}.sp{justify-content:space-between}.g{flex:1;min-width:0}
.card{background:linear-gradient(160deg,#2a5744,#1a3a2e);border:1px solid #6f9a8455;border-radius:18px;padding:14px;margin:0 0 12px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.bar{height:14px;background:#0b1a15;border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--o));border-radius:9px;transition:width .7s}
small,.mut{color:#cdd2c2;font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
.btn{min-height:44px;padding:8px 14px;border:0;border-radius:12px;background:var(--b);color:#fff;font-weight:600;cursor:pointer}
.btn.o{background:transparent;border:1px solid var(--o);color:var(--o)}.btn.s{min-width:44px;padding:4px 10px}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;background:#0d1f19;border:1px solid #5a8470;border-radius:10px;margin:4px 0 10px}
label{font-size:.85rem;color:var(--o)}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1a15f2;border-top:1px solid #5a8470;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-height:60px;background:none;border:0;font-size:.68rem;color:#b3bdae}nav button b{display:block;font-size:1.35rem}nav .on{color:var(--o)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--o);background:none;color:var(--f);font-size:1.1rem;font-weight:700;flex:none;cursor:pointer}
.done .chk{background:var(--o)}.done .tt{opacity:.65;text-decoration:line-through}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{margin:0}
summary{cursor:pointer;list-style:none;min-height:44px}summary::-webkit-details-marker{display:none}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}.modal>div{background:var(--f);width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px;border-radius:20px 20px 0 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--o);color:var(--f);padding:10px 16px;border-radius:30px;font-weight:700;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="m"></main><nav aria-label="Navegação"></nav><div id="toast" role="status" aria-live="polite"></div>
<script>
const K='jornadaPuri2',$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wk=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const per=p=>p=='d'?iso(new Date()):p=='w'?wk():'e',br=d=>(d||'').split('-').reverse().join('/');
const SK={
art:['🧵','Artesanato','Organização de materiais|Miçangas e sementes|Colares e pulseiras|Brincos e adornos|Desenvolvimento de coleções|Cerâmica|Cestaria e fibras|Técnicas avançadas|Registro e ensino de técnicas'.split('|')],
mat:['🏺','Cultura material','Pesquisa histórica|Identificação de referências|Registro fotográfico|Fichas técnicas|Catalogação|Estudos de reconstrução|Acervo digital|Exposição|Oficinas comunitárias'.split('|'),'Separe sempre: objeto histórico documentado, saber transmitido pela comunidade e criação contemporânea.'],
gui:['🎸','Violão','Conhecer o instrumento|Postura|Afinação|Ritmo|Primeiros acordes|Mudança entre acordes|Batidas|Dedilhados|Primeira música completa|Acompanhamento vocal|Composição|Repertório autoral'.split('|')],
vox:['🎤','Canto','Respiração|Preparação vocal|Percepção de altura|Afinação|Ritmo|Articulação|Projeção sem esforço|Resistência vocal|Interpretação|Cantar acompanhado de violão|Gravação|Apresentação'.split('|'),'Prática segura: aqueça devagar, hidrate-se e nunca force a voz. Sentiu dor ou rouquidão? Pare e descanse. Aulas com professor: registre pela missão “Fazer uma aula de canto”.'],
kwa:['🌿','Kwaytikindo','Revisão de vocabulário|Frases cotidianas|Uso oral|Composição musical|Preparação de aulas|Material pedagógico|Registro de conhecimentos|Transmissão e oficinas'.split('|')]};
const M0=[['Praticar violão por 20 minutos',20,'gui','d',20],['Praticar canto por 15 minutos',20,'vox','d',15],['Praticar Kwaytikindo',20,'kwa','d',20],['Pesquisar cultura material Puri',15,'mat','d',20],['Desenhar novos modelos',20,'art','d',30],['Aprender um acorde novo',30,'gui','w',30],['Fazer uma aula de canto',50,'vox','w',60],['Produzir uma peça artesanal',60,'art','w',120],['Documentar uma peça',45,'mat','w',45],['Criar material para ensinar',45,'kwa','w',60],['Finalizar uma coleção',150,'art','e',0,'colecao'],['Apresentar uma música',100,'gui','e',0,'apres'],['Preparar uma oficina',100,'kwa','e',0,'oficina']];
const C0=[['Capítulo I · Raízes','1–4',['Organizar o espaço de produção','Fazer inventário de materiais','Produzir oito protótipos','Aprender acordes iniciais','Começar a prática vocal']],['Capítulo II · Crescimento','5–8',['Desenvolver uma coleção artesanal','Documentar oito peças','Aprender uma música no violão','Registrar a evolução vocal','Desenvolver materiais em Kwaytikindo']],['Capítulo III · Florescimento','9–12',['Organizar um catálogo de artefatos','Finalizar uma música','Criar uma pequena apresentação musical','Compartilhar conhecimentos com outras pessoas Puri','Planejar a próxima etapa da jornada']]];
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],TP=['Aprendi','Produzi','Dificuldade','Descoberta','Ideia de peça','Experiência musical','Reflexão cultural'];
const CAT={h:'Histórico documentado',c:'Saber transmitido pela comunidade',n:'Criação contemporânea'};
const FL=[['mat','Materiais'],['tec','Técnica de fabricação'],['dim','Dimensões'],['data','Data'],['aut','Autoria'],['fonte','Fonte de pesquisa'],['sig','Significado (quando documentado)'],['obs','Observações'],['tempo','Tempo de fabricação (horas)'],['custo','Custo de produção (R$)']];
const def=()=>({m:M0.map(([t,xp,sk,p,min,id])=>({id:id||uid(),t,xp,sk,per:p,min})),l:[],st:{},un:[],ac:[],di:[],rt:['Descanso e convivência','Violão, canto e artesanato','Violão, pesquisa e língua','Violão, canto e artesanato','Violão, acervo e língua','Violão, canto e artesanato','Finalizar peças, fotografar trabalhos e revisar músicas'],camp:{start:wk(),ch:C0.map(([n,w,g])=>({n,w,g:g.map(t=>({t,d:0}))}))}});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)))}catch{S=def()}
let tab='home',mt='d',OP={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{toast('Sem espaço: exporte um backup em Mais')}};
const tot=()=>S.l.reduce((a,l)=>a+l.x,0),lvl=()=>Math.floor(tot()/100)+1,sx=k=>S.l.filter(l=>l.s==k).reduce((a,l)=>a+l.x,0),cnt=k=>S.l.filter(l=>l.s==k).length;
const hrs=()=>S.l.reduce((a,l)=>a+(l.mn||0),0)/60,done=id=>S.l.some(l=>l.m==id),isDone=m=>S.l.some(l=>l.m==m.id&&l.p==per(m.per));
const AC=[['🥇','Primeira Peça','1 missão de artesanato concluída',()=>cnt('art')>=1],['🧵','Artesão Persistente','10 missões de artesanato',()=>cnt('art')>=10],['📜','Pesquisador Puri','5 missões de cultura material',()=>cnt('mat')>=5],['🎸','Primeiros Acordes','3 missões de violão',()=>cnt('gui')>=3],['🎤','Voz em Evolução','5 missões de canto',()=>cnt('vox')>=5],['🏺','Guardião do Acervo','8 peças cadastradas no acervo',()=>S.ac.length>=8],['🌱','Criador de Coleções','Concluir “Finalizar uma coleção”',()=>done('colecao')],['🤝','Compartilhador de Saberes','Concluir uma oficina ou 5 missões de Kwaytikindo',()=>done('oficina')||cnt('kwa')>=5],['⏳','Cem Horas de Aprendizado','100 horas acumuladas',()=>hrs()>=100],['🎶','Primeira Apresentação','Concluir “Apresentar uma música”',()=>done('apres')]];
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
function after(a0,msg){const m=msg?[msg]:[];if(lvl()>a0)m.push('⭐ Nível '+lvl()+'!');AC.forEach(c=>{if(c[3]()&&!S.un.includes(c[1])){S.un.push(c[1]);m.push('🏅 '+c[1])}});save();render();if(m.length)toast(m.join(' · '))}
const img=f=>new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(u)};i.src=u});
function form(t,F,v,cb){const o=document.createElement('div');o.className='modal';o.innerHTML=`<div role="dialog" aria-label="${t}"><h2>${t}</h2>`+F.map(([k,l,ty,op])=>`<label>${l}</label>`+(ty=='sel'?`<select name="${k}">${op.map(([a,b])=>`<option value="${a}"${v[k]==a?' selected':''}>${b}</option>`).join('')}</select>`:ty=='area'?`<textarea name="${k}" rows="4">${esc(v[k])}</textarea>`:ty=='file'?`<input type="file" name="${k}" accept="image/*">`:`<input name="${k}" type="${ty}" value="${esc(v[k])}">`)).join('')+`<div class="row"><button class="btn o g" id="fx">Cancelar</button><button class="btn g" id="fs">Salvar</button></div></div>`;document.body.append(o);
o.querySelector('#fx').onclick=()=>o.remove();
o.querySelector('#fs').onclick=async()=>{const r={};for(const e of o.querySelectorAll('[name]'))r[e.name]=e.type=='file'?(e.files[0]?await img(e.files[0]):v[e.name]):e.value;if(cb(r)!==false)o.remove()}}
function ok(msg,cb){const o=document.createElement('div');o.className='modal';o.innerHTML=`<div role="dialog" aria-label="Confirmar"><p>${msg}</p><br><div class="row"><button class="btn o g" id="n">Cancelar</button><button class="btn g" id="y">Confirmar</button></div></div>`;document.body.append(o);o.querySelector('#n').onclick=()=>o.remove();o.querySelector('#y').onclick=()=>{o.remove();cb()}}
const A={
go(t){tab=t;render();scrollTo(0,0)},mt(k){mt=k;render()},
tog(id){const m=S.m.find(x=>x.id==id),p=per(m.per),i=S.l.findIndex(l=>l.m==id&&l.p==p),a=lvl();if(i>=0){S.l.splice(i,1);after(a,'Registro desfeito')}else{S.l.push({i:uid(),m:id,t:m.t,x:m.xp,s:m.sk,mn:m.min||0,p,d:iso(new Date())});after(a,'+'+m.xp+' XP 🌿')}},
ul(i){const a=lvl();S.l=S.l.filter(l=>l.i!=i);after(a,'Registro corrigido')},
em(id){const m=id?S.m.find(x=>x.id==id):{xp:20,sk:'gui',per:mt,min:0};form(id?'Editar missão':'Nova missão',[['t','Nome da missão','text'],['xp','XP','number'],['sk','Habilidade','sel',Object.entries(SK).map(([k,v])=>[k,v[0]+' '+v[1]])],['per','Período','sel',[['d','Diária'],['w','Semanal'],['e','Especial (uma vez)']]],['min','Minutos de prática (somam nas horas)','number']],m,r=>{if(!r.t.trim())return toast('Dê um nome à missão'),false;r.xp=Math.max(0,+r.xp||0);r.min=Math.max(0,+r.min||0);if(id)Object.assign(m,r);else S.m.push({id:uid(),...r});save();render()})},
dm(id){ok('Excluir esta missão? O histórico de XP é mantido.',()=>{S.m=S.m.filter(m=>m.id!=id);save();render()})},
st(k,j){const d=S.st[k]=S.st[k]||[];const i=d.indexOf(j);i<0?d.push(j):d.splice(i,1);save();render()},
cg(c,g){const o=S.camp.ch[c].g[g];o.d=o.d?0:1;save();render()},
eg(c,g){const o=S.camp.ch[c].g[g];form('Editar meta',[['t','Meta','text']],o,r=>{if(!r.t.trim())return false;o.t=r.t.trim();save();render()})},
ag(c){form('Nova meta',[['t','Meta','text']],{},r=>{if(!r.t.trim())return false;S.camp.ch[c].g.push({t:r.t.trim(),d:0});save();render()})},
dg(c,g){ok('Excluir esta meta?',()=>{S.camp.ch[c].g.splice(g,1);save();render()})},
rc(){ok('Recomeçar a contagem das 12 semanas a partir desta semana?',()=>{S.camp.start=wk();save();render()})},
ea(id){const x=id?S.ac.find(a=>a.id==id):{cat:'n',aut:'Kandu Puri'};form(id?'Editar peça':'Nova peça',[['nome','Nome da peça','text'],['foto','Fotografia','file'],['cat','Categoria','sel',Object.entries(CAT)],...FL.map(([k,l])=>[k,l,k=='data'?'date':k=='tempo'||k=='custo'?'number':k=='sig'||k=='obs'?'area':'text'])],x,r=>{if(!r.nome.trim())return toast('Dê um nome à peça'),false;const a=lvl();id?Object.assign(x,r):S.ac.push({id:uid(),...r});after(a)})},
da(id){ok('Excluir esta peça do acervo?',()=>{S.ac=S.ac.filter(a=>a.id!=id);save();render()})},
q(v){v=v.toLowerCase();document.querySelectorAll('.it').forEach(e=>e.hidden=!e.dataset.s.includes(v))},
ed(id){const x=id?S.di.find(a=>a.id==id):{tipo:TP[0],d:iso(new Date())};form(id?'Editar anotação':'Nova anotação',[['tipo','Tipo','sel',TP.map(t=>[t,t])],['d','Data','date'],['txt','Anotação','area']],x,r=>{if(!r.txt.trim())return toast('Escreva algo'),false;r.d=r.d||iso(new Date());id?Object.assign(x,r):S.di.push({id:uid(),c:Date.now(),...r});save();render()})},
dd(id){ok('Excluir esta anotação?',()=>{S.di=S.di.filter(a=>a.id!=id);save();render()})},
rt(i,v){S.rt[i]=v;save()},
ex(){const o=document.createElement('div');o.className='modal';o.innerHTML='<div role="dialog" aria-label="Backup"><h2>Backup</h2><p class="mut">Copie o texto e guarde onde quiser (notas, WhatsApp, e-mail). Para restaurar, cole o texto aqui e toque em Restaurar.</p><br><textarea id="bj" rows="8" aria-label="Texto do backup"></textarea><div class="row"><button class="btn o g" id="b1">Fechar</button><button class="btn o g" id="b2">Copiar</button><button class="btn g" id="b3">Restaurar</button></div></div>';document.body.append(o);const t=o.querySelector('#bj');t.value=JSON.stringify(S);o.querySelector('#b1').onclick=()=>o.remove();o.querySelector('#b2').onclick=()=>{t.select();try{navigator.clipboard.writeText(t.value);toast('Copiado 📋')}catch{document.execCommand('copy')}};o.querySelector('#b3').onclick=()=>ok('Isso substitui seus dados atuais. Continuar?',()=>{try{const d=JSON.parse(t.value);if(!Array.isArray(d.m)||!Array.isArray(d.l))throw 0;S=Object.assign(def(),d);save();o.remove();render();toast('Backup restaurado ✅')}catch{toast('Texto de backup inválido')}})},
im(f){if(!f||!confirm('Importar vai substituir seus dados atuais. Continuar?'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.m)||!Array.isArray(d.l))throw 0;S=Object.assign(def(),d);save();render();toast('Backup restaurado ✅')}catch{toast('Arquivo de backup inválido')}};r.readAsText(f)}};
const itemM=m=>`<div class="card row${isDone(m)?' done':''}"><button class="chk" aria-label="Concluir ${esc(m.t)}" onclick="A.tog('${m.id}')">${isDone(m)?'✓':''}</button><div class="g"><div class="tt">${esc(m.t)}</div><small>${SK[m.sk][0]} ${SK[m.sk][1]} · ${m.xp} XP${m.min?' · '+m.min+' min':''}</small></div><button class="btn s o" aria-label="Editar" onclick="A.em('${m.id}')">✎</button><button class="btn s o" aria-label="Excluir" onclick="A.dm('${m.id}')">🗑</button></div>`;
const tree=k=>{const [i,n,s,note]=SK[k],d=S.st[k]||[];return `<details class="card"${OP[k]?' open':''} ontoggle="OP['${k}']=this.open"><summary class="row"><span style="font-size:1.7rem">${i}</span><b class="g">${n}</b><small>Nível ${Math.floor(sx(k)/50)+1} · ${d.length}/${s.length} etapas</small></summary>${note?`<p class="mut">${note}</p><br>`:''}${s.map((t,j)=>`<div class="row${d.includes(j)?' done':''}"><button class="chk" aria-label="Marcar etapa ${t}" onclick="A.st('${k}',${j})">${d.includes(j)?'✓':j+1}</button><div class="g tt">${t}</div></div>`).join('')}</details>`};
const V={
home(){const t=tot(),L=lvl(),h=hrs(),d=new Date().getDay(),p=S.m.filter(m=>m.per=='d'&&!isDone(m)).length;
return `<div class="card"><div class="row"><div style="font-size:2.6rem">🌳</div><div class="g"><h1>Kandu Puri</h1><small>Artista da Cultura Viva</small></div><div style="text-align:center"><small>Nível</small><h1 style="color:var(--o)">${L}</h1></div></div><div class="bar" role="progressbar" aria-valuenow="${t%100}" aria-valuemax="100"><i style="width:${t%100}%"></i></div><small>${t%100}/100 XP · faltam ${100-t%100} para o nível ${L+1} · ${t} XP no total</small></div>
<div class="st"><div class="card"><small>Missões concluídas</small><h2 style="margin:0">${S.l.length}</h2></div><div class="card"><small>Conquistas</small><h2 style="margin:0">${AC.filter(c=>c[3]()).length}/${AC.length}</h2></div><div class="card"><small>Dias de prática</small><h2 style="margin:0">${new Set(S.l.map(l=>l.d)).size}</h2></div><div class="card"><small>Horas de aprendizagem</small><h2 style="margin:0">${h.toFixed(1).replace('.',',')}</h2></div></div>
<h2>Hoje</h2><div class="card"><small>${DN[d]} na rotina</small><p>${esc(S.rt[d])}</p><small>${p?p+' missão(ões) diária(s) esperando você':'Missões diárias em dia ✨'}</small></div>
<h2>Habilidades</h2>${Object.entries(SK).map(([k,v])=>{const x=sx(k);return `<div class="card"><div class="row sp"><b>${v[0]} ${v[1]}</b><small>Nível ${Math.floor(x/50)+1}</small></div><div class="bar"><i style="width:${x%50*2}%"></i></div><small>${x%50}/50 XP · ${x} XP no total</small></div>`}).join('')}
<p class="mut" style="text-align:center;margin-top:16px">Aprender, criar e transmitir, sem pressa e sem ranking. 🌿</p>`},
mis(){const L=S.m.filter(m=>m.per==mt),n=L.filter(isDone).length;
return `<h2 style="margin-top:0">Missões</h2><p class="mut">Descanso faz parte: dias sem prática não tiram nada de você.</p><br><div class="tabs">${[['d','Diárias'],['w','Semanais'],['e','Especiais']].map(([k,nm])=>`<button class="btn s${mt==k?'':' o'}" onclick="A.mt('${k}')">${nm}</button>`).join('')}</div><div class="row sp"><small>${n}/${L.length} concluídas${mt=='d'?' hoje':mt=='w'?' nesta semana':''}</small><button class="btn" onclick="A.em()">+ Missão</button></div>${L.map(itemM).join('')||'<p class="mut">Nenhuma missão aqui ainda. Crie a primeira!</p>'}
<h2>Histórico recente</h2>${S.l.slice(-15).reverse().map(l=>`<div class="card row"><div class="g"><div>${esc(l.t)}</div><small>${br(l.d)} · +${l.x} XP</small></div><button class="btn s o" aria-label="Desfazer registro" onclick="A.ul('${l.i}')">↩</button></div>`).join('')||'<p class="mut">Seus registros aparecem aqui. Marcou sem querer? É só desfazer.</p>'}`},
jor(){const w=Math.floor((new Date(wk())-new Date(S.camp.start))/6048e5)+1;
return `<h2 style="margin-top:0">Campanha de 12 semanas</h2><p class="mut">${w>12?'Campanha concluída 🌟 Hora de planejar a próxima etapa.':'Você está na semana '+Math.max(w,1)+' de 12.'}</p><br>`+S.camp.ch.map((c,ci)=>`<div class="card"><h3>${esc(c.n)}</h3><small>Semanas ${c.w}</small><br><br>${c.g.map((g,gi)=>`<div class="row${g.d?' done':''}"><button class="chk" aria-label="Marcar meta" onclick="A.cg(${ci},${gi})">${g.d?'✓':''}</button><div class="g tt">${esc(g.t)}</div><button class="btn s o" aria-label="Editar meta" onclick="A.eg(${ci},${gi})">✎</button><button class="btn s o" aria-label="Excluir meta" onclick="A.dg(${ci},${gi})">🗑</button></div>`).join('')}<button class="btn o" onclick="A.ag(${ci})">+ Meta</button></div>`).join('')+`<button class="btn o" onclick="A.rc()">Recomeçar contagem nesta semana</button><h2>Árvores de habilidade</h2><p class="mut">A cada 50 XP a habilidade sobe 1 nível. Marque as etapas conforme avançar.</p><br>${Object.keys(SK).map(tree).join('')}`},
ac(){const T=S.ac.reduce((a,x)=>a+(+x.tempo||0),0),C=S.ac.reduce((a,x)=>a+(+x.custo||0),0);
return `<div class="row sp"><h2 style="margin:0">Acervo</h2><button class="btn" onclick="A.ea()">+ Peça</button></div><p class="mut">${S.ac.length} peças · ${T} h de fabricação · R$ ${C.toFixed(2).replace('.',',')} de custo</p><br><input type="search" placeholder="Buscar por nome, material, técnica…" aria-label="Buscar no acervo" oninput="A.q(this.value)">${S.ac.map(x=>`<details class="card it" data-s="${esc([x.nome,x.mat,x.tec,CAT[x.cat]].join(' ').toLowerCase())}"><summary class="row">${x.foto?`<img src="${x.foto}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:12px">`:'<span style="font-size:2rem">🏺</span>'}<div class="g"><b>${esc(x.nome)}</b><br><small>${esc(CAT[x.cat])}</small></div></summary>${x.foto?`<img src="${x.foto}" alt="Foto de ${esc(x.nome)}" style="width:100%;border-radius:14px;margin:8px 0">`:''}${FL.map(([k,l])=>x[k]?`<p><small>${l}</small><br>${k=='data'?br(x[k]):esc(x[k])}</p>`:'').join('')}<div class="row" style="margin-top:10px"><button class="btn o g" onclick="A.ea('${x.id}')">Editar</button><button class="btn o g" onclick="A.da('${x.id}')">Excluir</button></div></details>`).join('')||'<p class="mut">Cadastre sua primeira peça 🏺</p>'}`},
di(){const L=S.di.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.c-a.c);
return `<div class="row sp"><h2 style="margin:0">Diário</h2><button class="btn" onclick="A.ed()">+ Anotar</button></div><p class="mut">Aprendizados, descobertas e ideias, do mais recente ao mais antigo.</p><br>${L.map(x=>`<div class="card"><div class="row sp"><small>${br(x.d)}</small><b>${esc(x.tipo)}</b></div><p style="white-space:pre-wrap">${esc(x.txt)}</p><div class="row"><button class="btn s o" onclick="A.ed('${x.id}')">Editar</button><button class="btn s o" onclick="A.dd('${x.id}')">Excluir</button></div></div>`).join('')||'<p class="mut">Nada anotado ainda. Escreva a primeira linha ✍️</p>'}`},
mais(){const d=new Date().getDay();
return `<h2 style="margin-top:0">Conquistas</h2><p class="mut">Desbloqueadas automaticamente quando os requisitos são cumpridos.</p><br><div class="st">${AC.map(c=>`<div class="card" style="text-align:center;${c[3]()?'':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:2rem">${c[0]}</div><b>${c[1]}</b><br><small>${c[2]}</small></div>`).join('')}</div>
<h2>Rotina semanal</h2><p class="mut">Edite como quiser: o ritmo é seu.</p><br>${[1,2,3,4,5,6,0].map(i=>`<div class="card"><label for="r${i}">${DN[i]}${i==d?' (hoje)':''}</label><textarea id="r${i}" rows="2" onchange="A.rt(${i},this.value)">${esc(S.rt[i])}</textarea></div>`).join('')}
<h2>Backup</h2><p class="mut">Seus dados ficam só neste aparelho. Exporte um backup de vez em quando.</p><br><button class="btn" onclick="A.ex()">Backup e restauração</button>
<p class="mut" style="margin-top:20px">Jornada pessoal de aprendizado. Não representa liderança nem autoridade sobre o povo Puri.</p>`}};
const TB=[['home','🏡','Início'],['mis','✅','Missões'],['jor','🧭','Jornada'],['ac','🏺','Acervo'],['di','📖','Diário'],['mais','🏅','Mais']];
function render(){$('#m').innerHTML=V[tab]();$('nav').innerHTML=TB.map(([k,i,n])=>`<button class="${tab==k?'on':''}"${tab==k?' aria-current="page"':''} onclick="A.go('${k}')"><b>${i}</b>${n}</button>`).join('')}
render();
</script></body></html>
